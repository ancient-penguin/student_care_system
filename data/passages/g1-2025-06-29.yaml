source: 고1 2025년 6월 학평 / 29번
text: >
  Studies of experts provide insight into [[1]] it means to have deep and
  flexible understanding. Experts in a particular domain are people who have
  deep, richly interconnected ideas about the world. They are not just good
  thinkers or people who are [[2]] smart. Rather, experts [[3]] knowledge in a
  specific domain—such as chess, chemistry, or tennis—and are not generalists.
  However, experts do not just know “a bunch of facts.” In fact, having
  expertise in a topic means [[4]] knowledge is organized into coherent
  frameworks, and the expert understands the inter-relationship between facts
  and can distinguish which ideas are most central. This kind of deep but
  organized understanding allows for greater flexibility in learning and [[5]]
  application across multiple contexts.
