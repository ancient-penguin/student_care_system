source: 고1 2025년 3월 학평 / 29번
text: >
  Routines enable athletes to evaluate competition conditions. For example,
  bouncing a ball in a volleyball service routine [[1]] the server with
  information about the ball, the floor, and the state of her muscles. This
  information can then be used to [[2]] prepare for her serve. Routines also
  enable athletes to adjust and fine-tune their preparations [[3]] on those
  evaluations or in pursuit of a particular competitive goal. This adaptation
  can involve adjustment to the conditions, rivals, competitive situation, or
  internal influences [[4]] can affect performance. Just like adjusting a
  race-car engine to the conditions of the track, air temperature, and weather,
  routines adjust all competitive components [[5]] proper performance.
