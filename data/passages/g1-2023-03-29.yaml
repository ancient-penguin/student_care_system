passage_id: g1-2023-03-29
kind: grammar
source: 고1 2023년 3월 학평 / 29번
text: >
  The most noticeable human characteristic projected onto animals is [[1]] they
  can talk in human language. Physically, animal cartoon characters and toys
  [[2]] after animals are also most often deformed in such a way as to resemble
  humans. This is achieved by [[3]] them with humanlike facial features and
  deformed front legs to resemble human hands. In more recent animated movies
  the trend has been to show the animals in a more “natural” way. However, they
  still use their front legs [[4]] human hands (for example, lions can pick up
  and lift small objects with one paw), and they still talk with an appropriate
  facial expression. A general strategy that is used to make the animal
  characters more emotionally appealing, both to children and adults, [[5]] to
  give them enlarged and deformed childlike features.
