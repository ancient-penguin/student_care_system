text: >
  To date, the focus of much of the research in medicine and the health sciences
  [[1]] understandably been on disease processes. Research on the physiological
  mechanisms linking mind and body has also focused primarily on the negative
  consequences of factors such as stress, trauma and ageing. Whereas a large
  body of research exists [[2]] the relationship between functioning of the
  brain and that of systems such as the autonomic, endocrine and immune systems,
  most of this research has focused on negative outcomes. It is becoming clear
  that well-being and ill-being may have biological, psychological, social and
  spiritual causes that are only partially overlapping and [[3]] to understand
  the body during states of wellness rather than under conditions of illness is
  essentially a paradigm shift in thinking. The positive health construct points
  to the intriguing possibility [[4]] the physiological mechanisms underlying
  thriving may be unique and may not merely mirror those underlying disease and
  illness. For example, the impact of well-being on secretion patterns of such
  hormones as cortisol, serotonin and oxytocin is not just the opposite to [[5]]
  of stress and distress.
