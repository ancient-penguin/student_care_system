passage_id: g2-2022-03-29
kind: grammar
source: 고2 2022년 3월 학평 / 29번
text: >
  Despite abundant warnings that we shouldn’t measure ourselves against others,
  most of us still do. We’re not only meaning-seeking creatures but social [[1]]
  as well, constantly making interpersonal comparisons to evaluate ourselves,
  improve our standing, and enhance our self-esteem. But the problem with social
  comparison is that it often backfires. When comparing ourselves to someone
  who’s doing better than we are, we often feel [[2]] for not doing as well.
  This sometimes leads to what psychologists call malignant envy, the desire for
  someone [[3]] with misfortune (“I wish she didn’t have what she has”). Also,
  comparing ourselves with someone who’s doing worse than we are [[4]] scorn,
  the feeling that others are something undeserving of our beneficence (“She’s
  beneath my notice”). Then again, comparing ourselves to others can also lead
  to benign envy, the longing to reproduce someone else’s accomplishments
  without wishing them ill (“I wish I had what she has”), [[5]] has been shown
  in some circumstances to inspire and motivate us to increase our efforts in
  spite of a recent failure.
