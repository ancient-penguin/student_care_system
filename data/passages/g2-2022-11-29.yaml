passage_id: g2-2022-11-29
kind: grammar
source: 고2 2022년 11월 학평 / 29번
text: >
  Pre-emption means that a strategy is designed to prevent a rival from starting
  some particular activity. In some case a pre-emptive move may simply be an
  announcement of some intent [[1]] might discourage rivals from doing the same.
  The idea of pre-emption implies that timing is sometimes very important—a
  decision or an action at one point in time might be much more rewarding than
  [[2]] it at a different time point. Pre-emption may involve up-weighting
  advertising for a period before and during [[3]] a new entrant launches into a
  market. The intent is to make it more difficult for the new entrant’s
  advertising to make an impression on potential buyers. Product proliferation
  is another potential pre-emption strategy. The general idea is to launch a
  large variety of product variants so that there is very little in the way of
  market demand that [[4]] not accommodated. Arguably, if a market is already
  filled with product variants it is more difficult for competitors to find
  [[5]] pockets of market demand.
items:
  - no: 1
    choice: that
    is_correct: true
    tag: 관계사
    model_slots:
      completeness: 불완전
      word: that
    explanation: 선행사 some intent를 받고 뒤의 절에 주어가 빠진 불완전한 절이므로 주격 관계대명사 that이 맞다.
  - no: 2
