passage_id: g3-2022-03-29
kind: grammar
source: 고3 2022년 3월 학평 / 29번
text: >
  We don’t know what ancient Greek music sounded like, because there are no
  examples of it in written or notated form, nor [[1]] survived in oral
  tradition. Much of it was probably improvised anyway, within certain rules and
  conventions. So we are forced largely to guess at its basis from the accounts
  of writers such as Plato and Aristotle, who were generally more concerned with
  writing about music as a philosophical and ethical exercise [[2]] with
  providing a technical primer on its practice. It seems Greek music was
  predominantly a vocal form, [[3]] of sung verse accompanied by instruments
  such as the lyre or the plucked kithara (the root of ‘guitar’). In fact, Plato
  considered music in which the lyre and flute played alone and not as the
  accompaniment of dance or song [[4]] ‘exceedingly coarse and tasteless’. The
  melodies seem to have had a very limited pitch range, since the instruments
  [[5]] span only an octave, from one E (as we’d now define it) to the next.
