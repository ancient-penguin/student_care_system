passage_id: g1-2023-06-29
kind: grammar
source: 고1 2023년 6월 학평 / 29번
text: >
  Although praise is one of the most powerful tools available for improving
  young children’s behavior, it is equally powerful for improving your child’s
  self-esteem. Preschoolers believe what their parents tell [[1]] in a very
  profound way. They do not yet have the cognitive sophistication to reason
  [[2]] and reject false information. If a preschool boy consistently hears from
  his mother [[3]] he is smart and a good helper, he is likely to incorporate
  that information into his self-image. Thinking of himself as a boy who is
  smart and knows how to do things [[4]] likely to make him endure longer in
  problem-solving efforts and increase his confidence in trying new and
  difficult tasks. Similarly, thinking of himself as the kind of boy who is a
  good helper will make him more likely to volunteer [[5]] with tasks at home
  and at preschool.
items:
  - no: 1
    choice: them
    is_correct: true
    tag: 대명사
    model_slots:
      word: them
      referent: Preschoolers
      number: 복수
    explanation: tell의 목적어로 복수 명사 Preschoolers를 가리키므로 them이 맞다.
  - no: 2
