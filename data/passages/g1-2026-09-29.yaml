passage_id: g1-2026-09-29
kind: grammar
source: 고1 2026년 9월 학평 / 29번
text: >
  To understand how breathing affects athletic performance, we first need to
  understand how the body makes energy from air and food. There are two
  options: with oxygen, a process known as aerobic respiration, and without
  it, [[1]] is called anaerobic respiration. Anaerobic energy is generated
  only with glucose (a simple sugar), and it’s quicker and easier for our
  bodies [[2]]. It’s a kind of backup system and turbo boost when the body
  doesn’t have enough oxygen. But anaerobic energy is inefficient and can be
  toxic, [[3]] too much lactic acid. The sickness, muscle weakness, and
  sweating you experience after you’ve pushed it too hard at the gym is the
  feeling of anaerobic overload. This process explains why the first few
  minutes of an intense workout [[4]] often so miserable. Our lungs and
  respiratory system haven’t caught up to supply the oxygen our bodies need,
  and so the body has to use anaerobic respiration. This also explains why,
  after we’re [[5]] up, exercise feels easier. The body has switched from
  anaerobic to aerobic respiration.
