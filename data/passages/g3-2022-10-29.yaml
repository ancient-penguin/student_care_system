passage_id: g3-2022-10-29
kind: grammar
source: 고3 2022년 10월 학평 / 29번
text: >
  The idea that leaders inherently possess certain physical, intellectual, or
  personality traits that distinguish them from nonleaders [[1]] the
  foundational belief of the trait‑based approach to leadership. This approach
  dominated leadership research from the late 1800s until the mid‑1940s and
  has experienced a resurgence of interest in the last couple of decades.
  Early trait theorists believed that some individuals are born with the
  traits that allow [[2]] to become great leaders. Thus, early research in
  this area often presented the widely stated argument [[3]] “leaders are
  born, not made.” Also, some of the earliest leadership studies were grounded
  in what [[4]] to as the “great man” theory because researchers at the time
  focused on identifying traits of highly visible leaders in history who were
  typically male and associated with the aristocracy or political or military
  leadership. In more recent history, numerous authors have acknowledged that
  there are many enduring qualities, [[5]] innate or learned, that contribute
  to leadership potential. These traits include such things as drive,
  self-confidence, cognitive ability, conscientiousness, determination,
  intelligence, and integrity.
