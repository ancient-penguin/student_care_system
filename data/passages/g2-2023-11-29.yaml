passage_id: g2-2023-11-29
kind: grammar
source: 고2 2023년 11월 학평 / 29번
text: >
  Lectins are large proteins that serve as a crucial weapon that plants use to
  defend [[1]]. The lectins in most plants bind to carbohydrates as we consume
  the plant. They also bind to sugar molecules [[2]] in the gut, in the brain,
  between nerve endings, in joints and in all bodily fluids. According to Dr.
  Steven Gundry, these sticky proteins can interrupt messaging between cells and
  [[3]] toxic and inflammatory reactions. Brain fog is just one result of
  lectins interrupting communication between nerves. An upset stomach is another
  common symptom of lectin overload. Dr. Gundry lists a wide range of other
  health problems including aching joints, dementia, headaches and infertility
  [[4]] have been resolved in his patients once they eliminated lectins from
  their diets. Dr. Paul Saladino writes that the hypothesis that lectins are
  involved in Parkinson’s disease is also gaining support, with animal studies
  [[5]] that ‘lectins, once eaten, may be damaging the gut and travelling to the
  brain, where they appear to be toxic to dopaminergic neurons’.
items:
