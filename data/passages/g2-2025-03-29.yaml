passage_id: g2-2025-03-29
kind: grammar
source: 고2 2025년 3월 학평 / 29번
text: >
  The prominence of the social dimension in food writing might suggest that the
  flavor of food is taking a back seat. I suspect [[1]] most people view flavor
  as of secondary importance in social settings where food is served. Although
  our social gatherings coalesce around food, the meaning of these gatherings
  does not seem to depend on flavor. Flavor [[2]] with the narrow purpose of
  filling the belly, and once that is accomplished it provides the backdrop for
  whatever social dynamics characterize the gathering. These can be understood
  independently of the flavor of the food on offer, the appreciation of [[3]] is
  understood to be personal and subjective. According to this conventional
  wisdom, the ceremonies and rituals around food, the social events that supply
  food with its meaning, [[4]] not depend on the quality of sensations provided
  by the food. To focus [[5]] on flavor is to miss the larger significance of
  these social relations.
