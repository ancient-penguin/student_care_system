passage_id: g1-2022-06-29
kind: grammar
source: 고1 2022년 6월 학평 / 29번
text: >
  Despite all the high-tech devices that seem to deny the need for paper, paper
  use in the United States [[1]] nearly doubled recently. We now consume more
  paper than ever: 400 million tons globally and growing. Paper is not the only
  resource [[2]] we are using more of. Technological advances often come with
  the promise of [[3]] fewer materials. However, the reality is that they have
  historically caused more materials use, making us [[4]] on more natural
  resources. The world now consumes far more “stuff” than it ever has. We use
  twenty-seven times more industrial minerals, such as gold, copper, and rare
  metals, than we [[5]] just over a century ago. We also each individually use
  more resources. Much of that is due to our high-tech lifestyle.
items:
  - no: 1
    choice: has
    is_correct: true
    tag: 수일치
    model_slots:
      subject: paper use
      number: 단수
      verb: has
    explanation: 주어는 United States가 아니라 paper use이므로 단수 동사 has가 맞다.
  - no: 2
    choice: that
    is_correct: true
    tag: 관계사
    model_slots:
