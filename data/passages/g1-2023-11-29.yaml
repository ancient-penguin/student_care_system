passage_id: g1-2023-11-29
kind: grammar
source: 고1 2023년 11월 학평 / 29번
text: >
  Some countries have proposed tougher guidelines for determining brain death
  when transplantation―transferring organs to others―is under consideration. In
  several European countries, there are legal requirements which specify [[1]] a
  whole team of doctors must agree over the diagnosis of death in the case of a
  potential donor. The reason for these strict regulations for diagnosing brain
  death in potential organ donors [[2]], no doubt, to ease public fears of a
  premature diagnosis of brain death for the purpose of obtaining organs. But it
  is questionable whether these requirements reduce public suspicions as much as
  they create [[3]]. They certainly maintain mistaken beliefs that diagnosing
  brain death is an unreliable process [[4]] precision. As a matter of
  consistency, at least, criteria for diagnosing the deaths of organ donors
  should be exactly the same as for those for [[5]] immediate burial or
  cremation is intended.
