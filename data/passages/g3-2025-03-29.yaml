passage_id: g3-2025-03-29
kind: grammar
source: 고3 2025년 3월 학평 / 29번
text: >
  We lack a sufficient vocabulary for [[1]] sense of the sources of error. The
  more scientific knowledge we accumulate, the better we understand that the
  ignorance [[2]] the knowledge enterprise is built is shockingly deep. For
  instance, it turned out that psychoanalysis’s attempt to delimit the sources
  of error by categorizing the kinds of mistakes to which humans are subject in
  light of the therapeutic situation in the talking cure [[3]] on misguided
  assumptions about the normalcy conditions for subjects. Digging deeper into
  the structure of the human mind as well as into the specific embodiment of
  human knowers equipped with a complex nervous system [[4]] that our mental
  life is filled with illusions on all levels of knowledge acquisition, from
  sensation to perception, from scientific discourse to the use of technology
  based on the latest scientific discovery. Yet, once again, we cannot make
  sense of this picture of ourselves as immersed in the area of ignorance and
  illusion without at the same time relying on a huge background of shared,
  objective knowledge that makes our ignorance [[5]] to us. Subjectivity and
  objectivity are interwoven with our fallibility.
