passage_id: g2-2026-09-29
kind: grammar
source: 고2 2026년 9월 학평 / 29번
text: >
  Capitalism is not a system where cash is everywhere but rather [[1]] in
  which islands of cash exchange exist within oceans of cheap―or potentially
  cheap―natures. [[2]] life within the cash nexus is expensive, and it grows
  more expensive over time. Workers’ wages can be frozen, even rolled back,
  but in the end inequality leads to crises of the kind we’ve recently seen
  [[3]] about populist protests in the United States and the United Kingdom.
  Workers demand dignity, and their labor becomes expensive. Production
  processes burn through an island, and energy is no longer cheap. The climate
  changes, and crops can no longer grow as [[4]] as they once did. Frontiers
  are so important in these processes because they offer places [[5]] the new
  cheap things can be seized ―and the cheap work of humans and other natures
  can be forcefully taken.
items:
