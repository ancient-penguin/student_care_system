passage_id: g3-2022-04-29
kind: grammar
source: 고3 2022년 4월 학평 / 29번
text: >
  The actual problems with monopolies are caused by statism, not capitalism.
  Under a statist social system, taxes, subsidies, tariffs, and regulations
  often serve to protect existing large players in the marketplace. Those
  players often use crony tactics to retain or expand the protections: a new
  tariff preventing foreign competition, a subsidy making it harder for new
  players [[1]] with them, or a regulatory measure that a large company has
  the resources to comply with. Under a capitalist social system, on the other
  hand, the government has no say in how [[2]] a company may become in its
  industry or how companies take over and merge with one another. Furthermore,
  a capitalist society doesn’t have rights-violating taxes, tariffs,
  subsidies, or regulations [[3]] anybody nor does it have antitrust laws.
  Under capitalism, dominance can only be achieved by becoming really good at
  [[4]] you’re doing. And to maintain dominance, you have to continue to stay
  ahead of the competition, which sees your dominance and profits as a sign
  [[5]] there is money to be made by others as well.
