source: 고1 2024년 6월 학평 / 29번
text: >
  The hunter-gatherer lifestyle, which can [[1]] as “natural” to human beings,
  appears to have had much to recommend it. Examination of human remains from
  early hunter-gatherer societies [[2]] suggested that our ancestors enjoyed
  abundant food, obtainable without excessive effort, and suffered very few
  diseases. If this is true, it is not clear why so many humans settled in
  permanent villages and developed agriculture, growing crops and domesticating
  animals: cultivating fields was hard work, and it was in farming villages
  [[3]] epidemic diseases first took root. Whatever its immediate effect on the
  lives of humans, the development of settlements and agriculture [[4]] led to a
  high increase in population density. This period, known as the New Stone Age,
  was a major turning point in human development, [[5]] the way to the growth of
  the first towns and cities, and eventually leading to settled “civilizations.”
