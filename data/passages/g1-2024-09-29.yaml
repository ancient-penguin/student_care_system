text: >
  From an organizational viewpoint, one of the most fascinating examples of
  how any organization may contain many different types of culture [[1]] to
  recognize the functional operations of different departments within the
  organization. The varying departments and divisions within an organization
  will inevitably view any given situation from their own biased and
  prejudiced perspective. A department and its members will acquire “tunnel
  vision” which disallows them to see things as others see [[2]]. The very
  structure of organizations can create conflict. The choice of [[3]] the
  structure is “mechanistic” or “organic” can have a profound influence on
  conflict management. A mechanistic structure has a vertical hierarchy with
  many rules, many procedures, and many levels of management [[4]] in decision
  making. Organic structures are more horizontal in nature, [[5]] decision
  making is less centralized and spread across the plane of the organization.
items:
