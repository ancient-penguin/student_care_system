passage_id: g3-2022-07-29
kind: grammar
source: 고3 2022년 7월 학평 / 29번
text: >
  The spider chart, also called a radar chart, is a form of line graph. It helps
  the researcher to represent their data in a chart [[1]] shows the relative
  size of a response on one scale for interrelated variables. Like the bar
  chart, the data needs to have one scale which is common to all variables. The
  spider chart is drawn with the variables spanning the chart, [[2]] a spider
  web. An example of this is seen in a research study looking at self-reported
  confidence in year 7 students across a range of subjects [[3]] in their first
  term in secondary school. The researcher takes the responses from a sample
  group and [[4]] the mean to plot on the spider chart. The spider chart allows
  the researcher to easily compare and contrast the confidence level in
  different subjects for the sample group. The chart, like the pie chart, can
  then be broken down for different groups of students within the study [[5]]
  further analysis of findings.
