passage_id: g3-2025-07-29
kind: grammar
source: 고3 2025년 7월 학평 / 29번
text: >
  There is a kind of artificial intelligence application that is frequently
  advertised, which can be described as “vaporware”. Vaporware is applications
  that have either been announced or made [[1]] for sale but are not yet fully
  functional as artificial intelligence applications. It is often systems that
  seem to run on artificial intelligence technologies, but which in fact [[2]]
  not. Instead, they are frequently built by people manually adding the content
  [[3]] the artificial intelligence application is supposed to be processing.
  This is frequently done because initially it is cheaper to pay people to add
  this content than it is [[4]] full artificial intelligence capabilities and
  populate the data. Vaporware can be used for many reasons. Sometimes a product
  may start to be sold before it is fully developed. Taking a vaporware product
  to market means developers can validate ideas with customers before investing
  the amounts [[5]] to build a full application, allowing for more flexibility
  in development and for more time to build data.
