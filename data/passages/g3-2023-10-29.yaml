source: 고3 2023년 10월 학평 / 29번
text: >
  Dr. Joseph Bell was a professor of medicine at the University of Edinburgh.
  His students were amazed by his astonishing powers of observation. He seemed
  able to determine what patients did for a living, or what illness [[1]] might
  have, simply by glancing in their direction. One time he concluded that a
  patient [[2]] across a golf course on the way to the doctor, simply by looking
  at his shoes. One of Bell’s students was particularly impressed with his
  teacher’s abilities. He filled up notebooks with examples of [[3]] he called
  Bell’s “eerie trick of spotting details.” The student eventually went into
  practice himself outside London. When business was slow he filled his spare
  moments by writing stories. He took Dr. Bell’s powers of perception, and gave
  them to a character of his own making— a character who made the young doctor,
  Arthur Conan Doyle, [[4]] around the world. And so the professor who made even
  the most complex diagnosis seem “elementary” [[5]] the inspiration for
  fiction’s greatest detective, Sherlock Holmes.
