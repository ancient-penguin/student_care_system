source: 고1 2026년 6월 학평 / 29번
text: >
  Literature, in its essence, is a testament to the enduring power of human
  creativity and expression. It transcends time and space, [[1]] us with the
  thoughts and emotions of people from all walks of life, across centuries and
  cultures. [[2]] the rise of new technologies and the ever-changing landscape
  of media, literature has retained its relevance and significance as a timeless
  art form. One reason for literature’s enduring power is its ability to capture
  and [[3]] the complexities of the human experience. Through the written word,
  authors [[4]] the unique ability to explore the depths of human emotion, the
  nuances of relationships, and the challenges and triumphs of the human spirit.
  Literature allows us to see ourselves [[5]] in the pages of a book, to
  empathize with characters different from ourselves, and to gain a deeper
  understanding of the human condition.
