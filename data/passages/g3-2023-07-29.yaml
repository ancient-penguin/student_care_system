text: >
  The intelligence of monkeys pales in comparison with that of our closest
  relatives, the great apes: orangutans, gorillas, chimpanzees, and bonobos,
  whose brains are twice as [[1]] relative to their body weight. Most
  primatologists believe the apes acquired their larger brains to help them
  communicate with and [[2]] their peers. And they certainly do exhibit complex
  social interactions within their group; they seem capable of feeling empathy,
  have a self-image, and exhibit a degree of consciousness as they can recognize
  [[3]] in a mirror. But this “social hypothesis” does not explain why it was
  the great apes that became so clever, rather than monkeys or a group of
  terrestrial mammals. Nor does it explain why orangutans, who seldom encounter
  their neighbors, [[4]] so intelligent. It seems likely that some other factor
  must have been in play [[5]] caused apes to become more intelligent in the
  first place, and which could subsequently have enabled some members of the
  group to develop high-level sociality.
