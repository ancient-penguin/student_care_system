passage_id: g3-2026-csat-29
kind: grammar
source: 2026학년도 수능 / 29번
text: >
  We are exceptionally smart, and this helps us adapt to a wide range of
  environments. But we are not nearly smart enough as individuals [[1]] the
  adaptive problems that confronted modern humans as they spread across the
  globe. The package of tools, foraging techniques, ecological knowledge, and
  social arrangements used by any group of foragers [[2]] far too complex for
  any individual to create. We are able to learn all the things we need to
  know in each of the many different environments [[3]] we live only because
  we acquire information from others. We are much better at learning from
  others than other species are, and we are [[4]] to learn from others even
  when we do not understand why our models are doing what they are doing. This
  psychology allows human populations to accumulate pools of adaptive
  information that [[5]] exceed the inventive capacities of individuals.
