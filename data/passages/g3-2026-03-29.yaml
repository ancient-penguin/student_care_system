passage_id: g3-2026-03-29
kind: grammar
source: 고3 2026년 3월 학평 / 29번
text: >
  Darwin understood that since inheritance is conservative, it is in the
  nature of the organism to impose itself on the surroundings, [[1]] many
  highly similar but variable offspring regardless of the nature of the
  conditions. He further recognized that these fundamental aspects of the
  nature of the organism [[2]] reproductive overrun, with organisms routinely
  producing more offspring than there are resources to support them. The need
  to survive implies that the capacity for using necessary resources must
  complement the opportunity to use [[3]]. But needs and opportunity do not
  perfectly match. Inheritance produces the capacities for exploiting the
  surroundings, but in a way that is indifferent to the surroundings.
  Offspring cannot anticipate the nature of the conditions [[4]] they find
  themselves, much less alter themselves in ways that are suitable to any
  changes in those conditions. While it is true that organisms can express
  some amount of flexibility in their form and function in response to their
  immediate surroundings, these adjustments are [[5]] compared to the
  constraints of inheritance. As a result, not every living thing can live
  everywhere.
