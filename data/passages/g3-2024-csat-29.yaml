passage_id: g3-2024-csat-29
kind: grammar
source: 2024학년도 수능 / 29번
text: >
  A number of studies provide substantial evidence of an innate human
  disposition to respond differentially to social stimuli. From birth, infants
  will orient preferentially towards the human face and voice, [[1]] to know
  that such stimuli are particularly meaningful for them. Moreover, they
  register this connection actively, imitating a variety of facial gestures that
  are presented to them ― tongue protrusions, lip tightenings, mouth openings.
  They will even try to match gestures [[2]] they have some difficulty,
  experimenting with their own faces until they succeed. When they [[3]]
  succeed, they show pleasure by a brightening of their eyes; when they fail,
  they show distress. In other words, they not only have an innate capacity for
  matching their own kinaesthetically experienced bodily movements with [[4]] of
  others that are visually perceived; they have an innate drive to do so. That
  is, they seem to have an innate drive to imitate others whom they judge [[5]]
  ‘like me’.
items:
  - no: 1
    choice: seeming
    is_correct: true
    tag: 분사
    model_slots:
      noun: infants
      relation: 능동
      word: seeming
    explanation: 주어 infants가 '~처럼 보이는' 능동 관계의 분사구문이므로 seeming이 맞다.
  - no: 2
