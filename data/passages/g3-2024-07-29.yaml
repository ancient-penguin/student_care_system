passage_id: g3-2024-07-29
kind: grammar
source: 고3 2024년 7월 학평 / 29번
text: >
  When we assess potential, we make the cardinal error of focusing on starting
  points—the abilities that are immediately visible. In a world obsessed with
  innate talent, we assume the people with the most promise [[1]] the ones who
  stand out right away. But high achievers vary dramatically in their initial
  aptitudes. If we judge people only by what they can do on day one, their
  potential remains hidden. You can’t tell [[2]] people will land from where
  they begin. With the right opportunity and motivation [[3]], anyone can
  build the skills to achieve greater things. Potential is not a matter of
  where you start, but of how far you travel. We need to focus less on
  starting points and more on distance [[4]]. For every Mozart who makes a big
  splash early, there are multiple Bachs who ascend slowly and [[5]] late.
  They’re not born with invisible superpowers; most of their gifts are
  homegrown or homemade.
