passage_id: g3-2023-04-29
kind: grammar
source: 고3 2023년 4월 학평 / 29번
text: >
  Providing feedback to students is a critical task of teachers. General
  psychology has shown that knowledge of results is necessary for improving a
  skill. Advanced musicians are able to self-critique their performances, but
  developing music students [[1]] on teachers to supply evaluative feedback. The
  most constructive feedback is that [[2]] expresses the discrepancies between a
  student’s performance of a piece of music and an optimal version. Expert
  teachers give more detailed feedback than general appraisals, and music
  educators generally recognize that more specific teacher feedback facilitates
  student performance improvement. Researchers also have explored [[3]] the
  feedback of effective teachers is more often positively or negatively
  expressed, that is, constituting praise or criticism. One might intuitively
  think that positive comments are more [[4]] to students and, as a result, are
  more associated with effective teaching. The research, however, paints a
  slightly different picture. Although positive feedback is [[5]] more helpful
  with younger learners and in one-on-one instruction, more advanced music
  students seem to accept and benefit from greater levels of criticism in
  lessons.
