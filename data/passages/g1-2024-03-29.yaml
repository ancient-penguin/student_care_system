passage_id: g1-2024-03-29
kind: grammar
source: 고1 2024년 3월 학평 / 29번
text: >
  It would be hard to overstate how important meaningful work is to human
  beings—work [[1]] provides a sense of fulfillment and empowerment. Those who
  have found deeper meaning in their careers find their days much more
  energizing and satisfying, and [[2]] their employment as one of their greatest
  sources of joy and pride. Sonya Lyubomirsky, professor of psychology at the
  University of California, has conducted numerous workplace studies [[3]] that
  when people are more fulfilled on the job, they not only produce higher
  quality work and a greater output, but also generally earn higher incomes.
  Those most satisfied with their work [[4]] also much more likely to be happier
  with their lives overall. For her book Happiness at Work, researcher Jessica
  Pryce-Jones conducted a study of 3,000 workers in seventy-nine countries,
  [[5]] that those who took greater satisfaction from their work were 150
  percent more likely to have a happier life overall.
