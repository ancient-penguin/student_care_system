passage_id: g1-2026-10-29
kind: grammar
source: 고1 2026년 10월 학평 / 29번
text: >
  Since hydra and the immortal jellyfish don’t exhibit obvious signs of aging,
  they are often called biologically immortal. This doesn’t mean they don’t die.
  Nor does it even [[1]] that they cannot die of biological causes. But, unlike
  most every animal, their likelihood of dying does not increase with age.
  Species such as hydra and the immortal jellyfish excite gerontologists because
  they may provide clues about how to defeat the aging process. But their
  property of being able to regenerate entire body parts, or even a whole
  organism, [[2]] them more similar to trees than to us. Although we may learn
  some fascinating things about their lack of apparent aging, it is not at all
  clear how [[3]] those findings will be to human aging. Sometimes biology is
  universal, especially if it relates to fundamental mechanisms. But in other
  cases, even discoveries in rats or mice, [[4]] are mammals and biologically
  much closer to us, are difficult to translate into humans. It may be a very
  long time before any findings gained from hydra or jellyfish [[5]] useful to
  us.
