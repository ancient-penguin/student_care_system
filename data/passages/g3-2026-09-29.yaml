text: >
  Leaders come in all shapes and sizes, but successful leaders tend to have
  one thing in common: the ability to share someone else’s feelings, known as
  empathy. While empathy forms in everyone to some degree, effective leaders
  know how to develop this emotional guidance system [[1]] with others’
  feelings and perspectives. However, empathy in leaders is more than [[2]]
  being kind to employees, clients, and customers. Empathetic people seem more
  approachable, focusing on the words of others. Listening to the needs of
  employees [[3]] leaders to clearly identify what makes them feel heard.
  Utilized in this way, empathy can be considered a crucial part of [[4]]
  employee satisfaction. Leaders who are unable to surround themselves with
  competent employees will not be successful. Indeed, a leader’s failure to
  empathize with talented workers is one of the main situations [[5]] could
  lead them to leave an organization. In this case, the organization must
  spend precious time and money to find suitable replacements for them.
