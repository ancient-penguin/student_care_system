source: 고2 2026년 6월 학평 / 29번
text: >
  The renowned British philosopher Alfred North Whitehead asserted that
  “civilization advances by extending the number of operations we can perform
  without thinking about them.” Take, for example, the “advance” [[1]] to
  civilization by the discount coupon, which allows consumers to assume that
  they will receive a reduced purchase price by presenting the coupon. The
  extent to which we have learned to operate mechanically on that assumption is
  illustrated in the experience of one automobile-tire company. Mailed-out
  coupons that―because of a printing error―offered no savings to recipients
  [[2]] just as much customer response as did error-free coupons that offered
  substantial savings. The obvious but instructive point here is [[3]] we expect
  discount coupons to do double duty. Not only [[4]] we expect them to save us
  money, we also expect them to save us the time and mental energy required to
  think about how to do it. In today’s world, we need the first advantage to
  handle pocketbook strain; but we need the second advantage to handle something
  [[5]] more important―brain strain.
