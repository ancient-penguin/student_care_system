passage_id: g3-2026-05-29
kind: grammar
source: 고3 2026년 5월 학평 / 29번
text: >
  A study by Eurofound found that young people who were working remotely [[1]]
  more difficulties in managing their workload than older colleagues. Moreover,
  many young people began their careers working remotely during the pandemic,
  unlike those in older generations who had many years to establish
  interpersonal connections and embed [[2]] in the organizational culture in an
  in-person job. A survey by Prospects found that almost half of students and
  graduates in the United Kingdom found [[3]] difficult to work from home during
  the pandemic due to a lack of suitable workspace or distractions. While young
  people may struggle long-term with remote work, perhaps more of a hybrid model
  [[4]] they can work from home part of the time and work onsite other times,
  would work well for them. But it may not be that they need a formal hybrid
  structure with specific days of the week designated for working remotely but
  instead a fluid option that allows them, if possible, depending on the job
  role, [[5]] their day-to-day work location.
