text: >
  Honey can be eaten by itself or mixed with other ingredients. Natural or pure
  honey has had no additives, preservatives or synthetic ingredients added. Also
  [[1]] to as ‘undiluted’, it is usually more expensive than diluted honeys.
  Natural honey can also be called ‘blended honey’, [[2]] honeys from various
  sources are blended together ― not by the bees, but by human processors and
  distributors in stages after the honey has been collected. Blending is
  frequently done for taste as well as marketing reasons, especially since some
  consumers find the darker honeys too [[3]]. Mixing different types of honey
  together can make it more palatable, and also gives a more uniform flavour ―
  this is an important consideration for producers and retailers, who [[4]] the
  need to guarantee reliable, unsurprising (typically mild) flavours to their
  customers. Clover is one of the most popular honeys in the U.S., and [[5]]
  mild flavour and taste have become familiar to many Americans.
