passage_id: g3-2022-06-29
kind: grammar
source: 고3 2022년 6월 모평 / 29번
text: >
  Ecosystems differ in composition and extent. They can be defined as ranging
  from the communities and interactions of organisms in your mouth or [[1]] in
  the canopy of a rain forest to all those in Earth’s oceans. The processes
  [[2]] them differ in complexity and speed. There are systems that turn over in
  minutes, and there are others [[3]] rhythmic time extends to hundreds of
  years. Some ecosystems are extensive (‘biomes’, such as the African savanna);
  some cover regions (river basins); many involve clusters of villages
  (micro-watersheds); others are confined to the level of a single village (the
  village pond). In each example there is an element of indivisibility. Divide
  an ecosystem into parts by creating barriers, and the sum of the productivity
  of the parts will typically be found to be lower than the productivity of the
  whole, other things [[4]] equal. The mobility of biological populations is a
  reason. Safe passages, for example, enable migratory species [[5]].
