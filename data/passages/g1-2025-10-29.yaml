source: 고1 2025년 10월 학평 / 29번
text: >
  Human beings have evolved to make the most of the resources available to them
  in ways that are subtle and complicated. When we change our diets, especially
  when we do so quickly, we are [[1]] conducting huge experiments in nutrition.
  We ought to have more humility. Nutritional science is still young and there
  is so much we do not know. If we have eaten certain foods in certain ways for
  millennia, we should assume until it is proven otherwise [[2]] there is
  probably a good reason why. Traditional foods that don’t fit neatly on the
  contemporary dietary food plate should generally be chosen over highly
  processed ones that [[3]]. We should assume that traditionally [[4]] fatty
  blood sausages are preferable to lean, factory-made salamis; that spoonfuls of
  honey are superior to sprinkles of sweeteners. Witnessing how poorly
  traditional societies are faring as they undergo a nutrition transition should
  make those who have already completed it [[5]] whether their diets have moved
  too far.
