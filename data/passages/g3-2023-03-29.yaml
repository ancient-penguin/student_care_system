passage_id: g3-2023-03-29
kind: grammar
source: 고3 2023년 3월 학평 / 29번
text: >
  From the 8th to the 12th century CE, while Europe suffered the perhaps
  overdramatically named Dark Ages, science on planet Earth could be found
  almost [[1]] in the Islamic world. This science was not exactly like our
  science today, but it was surely antecedent to [[2]] and was nonetheless an
  activity aimed at knowing about the world. Muslim rulers granted scientific
  institutions tremendous resources, such as libraries, observatories, and
  hospitals. Great schools in all the cities [[3]] the Arabic Near East and
  Northern Africa (and even into Spain) trained generations of scholars.
  Almost every word in the modern scientific lexicon that begins with the
  prefix “al” [[4]] its origins to Islamic science—algorithm, alchemy,
  alcohol, alkali, algebra. And then, just over 400 years after it started, it
  ground to an apparent halt, and it would be a few hundred years, give or
  take, before [[5]] we would today unmistakably recognize as science appeared
  in Europe—with Galileo, Kepler, and, a bit later, Newton.
