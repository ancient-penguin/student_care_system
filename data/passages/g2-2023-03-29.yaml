passage_id: g2-2023-03-29
kind: grammar
source: 고2 2023년 3월 학평 / 29번
text: >
  Human beings like certainty. This liking stems from our ancient ancestors
  [[1]] needed to survive alongside saber‑toothed tigers and poisonous berries.
  Our brains evolved to help us attend to threats, keep away from [[2]], and
  remain alive afterward. In fact, we learned that the more [[3]] we were about
  something, the better chance we had of making the right choice. Is this berry
  the same shape as last time? The same size? If I know for certain it [[4]], my
  brain will direct me to eat it because I know it’s safe. And if I’m uncertain,
  my brain will send out a danger alert to protect me. The dependence on
  certainty all those millennia ago ensured our survival to the present day, and
  the danger‑alert system continues to protect us. This is achieved by our
  brains labeling new, vague, or unpredictable everyday events and experiences
  as uncertain. Our brains then [[5]] sensations, thoughts, and action plans to
  keep us safe from the uncertain element, and we live to see another day.
