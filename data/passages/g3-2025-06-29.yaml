source: 고3 2025년 6월 모평 / 29번
text: >
  Changes in the degree of closeness [[1]] quite important in managing
  emotional intensity. Take, for example, emotions induced by television.
  Closeness and familiarity are important in making the fictional environment
  more [[2]]. Accordingly, most TV shows are set in the present or in a time
  within the memory of the viewers. Most characters are supposed to be types
  with whom we are familiar. Such closeness and familiarity make it easier for
  us [[3]] the imaginary story to be a real one. In other circumstances, such
  as when violence is shown on TV, the closeness variable is used to reduce
  emotional intensity. Television entertainment tends to place social problems
  involving violence in another time and place, letting us watch those
  fictionalized characters search for solutions to our problems in settings
  [[4]] distanced from our own. When violence occurs in a contemporary
  setting, it is generally the product of the interaction of police and
  criminals ― again, it is [[5]] from the lives of good citizenry.
