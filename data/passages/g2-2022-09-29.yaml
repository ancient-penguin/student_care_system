passage_id: g2-2022-09-29
kind: grammar
source: 고2 2022년 9월 학평 / 29번
text: >
  By noticing the relation between their own actions and resultant external
  changes, infants develop self‐efficacy, a sense [[1]] they are agents of the
  perceived changes. Although infants can notice the effect of their behavior
  on the physical environment, it is in early social interactions that infants
  most [[2]] perceive the consequence of their actions. People have perceptual
  characteristics that virtually [[3]] that infants will orient toward them.
  They have visually contrasting and moving faces. They produce sound, provide
  touch, and have interesting smells. In addition, people engage with infants
  by exaggerating their facial expressions and inflecting their voices in ways
  that infants find [[4]]. But most importantly, these antics are responsive
  to infants’ vocalizations, facial expressions, and gestures; people vary the
  pace and level of their behavior in response to infant actions.
  Consequentially, early social interactions provide a context [[5]] infants
  can easily notice the effect of their behavior.
