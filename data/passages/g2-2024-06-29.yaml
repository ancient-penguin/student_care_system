passage_id: g2-2024-06-29
kind: grammar
source: 고2 2024년 6월 학평 / 29번
text: >
  The built-in capacity for smiling is proven by the remarkable observation
  [[1]] babies who are congenitally both deaf and blind, who have never seen a
  human face, also start to smile at around 2 months. However, smiling in blind
  babies eventually [[2]] if nothing is done to reinforce it. Without the right
  feedback, smiling dies out. But here’s a fascinating fact: blind babies will
  continue to smile if they are cuddled, bounced, nudged, and tickled by an
  adult ―anything to let [[3]] know that they are not alone and that someone
  cares about them. This social feedback encourages the baby to continue
  smiling. In this way, early experience operates with our biology [[4]] social
  behaviors. In fact, you don’t need the cases of blind babies to make the
  point. Babies with sight smile more at you when you look at them or, better
  still, [[5]] back at them.
