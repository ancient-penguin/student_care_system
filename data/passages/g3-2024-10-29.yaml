passage_id: g3-2024-10-29
kind: grammar
source: 고3 2024년 10월 학평 / 29번
text: >
  Sometime late in the next millennium, our descendants may head off to other
  star systems. They may use comets as stepping-stones, some of which are only
  [[1]] bound to our sun because they reach almost halfway to the nearest star
  system, Alpha Centauri. Our remote descendants may eventually colonize much of
  our galaxy just as the first living organisms on Earth once colonized Earth’s
  young oceans. Interstellar migrations will depend on as yet unimagined
  technologies for driving ships, for maintaining sustainable environments, and
  for putting humans into hibernations [[2]] for centuries. Interstellar
  journeys will also depend on the existence of groups willing [[3]] long and
  dangerous voyages with little or no hope of returning. It would take
  spaceships [[4]] at 1 percent of the speed of light more than four hundred
  years to reach the Alpha Centauri system. But if they spread out from there at
  a similar rate, they could settle star systems throughout the Milky Way within
  one hundred million years, [[5]] is just a bit longer than the span of time
  since dinosaurs ruled our Earth.
