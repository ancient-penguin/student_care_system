passage_id: g1-2024-10-29
kind: grammar
source: 고1 2024년 10월 학평 / 29번
text: >
  Digital technologies are essentially related to metaphors, but digital
  metaphors are different from linguistic [[1]] in important ways. Linguistic
  metaphors are passive, in the sense that the audience needs to choose to
  actively enter the world proposed by metaphor. In the Shakespearean metaphor
  “time is a beggar,” the audience is unlikely to understand the metaphor
  without cognitive effort and without further [[2]] Shakespeare’s prose.
  Technological metaphors, on the other hand, are active (and often imposing) in
  the sense that they are realized in digital artifacts that are actively doing
  things, forcefully [[3]] a user’s meaning horizon. Technological creators
  cannot generally afford to require their potential audience to wonder how the
  metaphor works; normally the selling point is [[4]] the usefulness of the
  technology is obvious at first glance. Shakespeare, on the other hand, is
  beloved in part because the meaning of his works is not immediately obvious
  and [[5]] some thought on the part of the audience.
