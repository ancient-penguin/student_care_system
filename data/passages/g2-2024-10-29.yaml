source: 고2 2024년 10월 학평 / 29번
text: >
  Conditioned Place Preference is a way of finding out what animals want.
  Researchers train them [[1]] one place with an experience such as food or a
  loud noise and another place with something completely different, usually
  where nothing happens. The two places are made obviously different to make it
  as [[2]] as possible for the animal to associate each place with what happened
  to it there. The animal’s preference for being in one place or another is
  measured both before and after its experiences in the two places. If there is
  a shift in where the animal chooses to spend its time for the reward, this
  suggests that it liked the experience and is trying to repeat [[3]].
  Conversely, if it now avoids the place the stimulus appeared and [[4]] to
  prefer the place it did not experience it, then this suggests that it found
  the stimulus unpleasant. For example, mice with cancer show a preference for
  the place where they have [[5]] morphine, a drug used to relieve pain, rather
  than where they have received saline whereas healthy mice developed no such
  preference. This suggests that the mice with cancer wanted the morphine.
