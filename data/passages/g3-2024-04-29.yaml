passage_id: g3-2024-04-29
kind: grammar
source: 고3 2024년 4월 학평 / 29번
text: >
  When a new pathogen emerges, one way it transitions from wherever it has been
  living into a new host may be the acquisition of new traits. Imagine that in
  [[1]] hourly struggle to survive over long periods of time and many
  generations, a fungus species might acquire a protective capsule―a bit of
  coating―that shields it or even masks it from other microbes or cells. Then it
  acquires some enzymes that enable it to survive [[2]] chemicals other microbes
  might throw at it. If it can overcome these chemicals, it may also overcome
  the same or similar chemicals [[3]] as antifungal drugs. Maybe it also evolves
  to tolerate warmer temperatures. Now we’ve got a yeast that once made its home
  in an apple tree or in a wetland but [[4]] at this point can live quite
  happily in our body, hide from our immune system, and disarm our drugs. Then
  some of us carry it from one country to another and then another, and
  eventually it finds a host in a hospital patient who has recently received an
  organ transplant or [[5]] elderly with a weakened immune system.
